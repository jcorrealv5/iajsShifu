<html>
	<body>
		{% load static %}
		<link href="{% static 'static/styles/IAJS.css'%}" rel="stylesheet" />
		<div>
			<h1>Demo 05: Captura de Cara con MediaPipe y Envio al Servidor con XHR</h1>
			<div>
				<input id="btnActivarCamara" type="button" value="Activar Camara" />
				<input id="btnTomarFoto" type="button" value="Tomar Foto" />
				<input id="txtNombre" type="text" width="300"/>
				<input id="btnEnviarFoto" type="button" value="Enviar Foto" />
			</div>
			<div>
				<div><video id="video" width="600" height="500" style="float:left"></video></div>
				<div><canvas id="canvas" width="600" height="500" style="float:left"></canvas></div>
				<div><canvas id="canvasCara" width="200" height="200" style="float:left;display:none"></canvas></div>
				<div><img id="imgCara" src="" width="200" height="200" style="float:left"/>
			</div>
			{% csrf_token %}
		</div>
		<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
		<script src="{% static 'appDemo05/DeteccionRostro.js'%}"></script>
	</body>
</html>
