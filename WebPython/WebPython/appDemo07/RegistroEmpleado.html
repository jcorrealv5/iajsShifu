<html>
	<body>
		{% load static %}
		<link href="{% static 'static/styles/IAJS.css'%}" rel="stylesheet" />
		<div>
			<h1>Demo 07: Registro de Empleados</h1>
			<table>
				<tr>
					<td style="width:5%">Codigo</td>
					<td style="width:10%">Apellidos</td>
					<td style="width:10%">Nombres</td>
					<td style="width:10%">DNI</td>
					<td style="width:10%">Fecha Nac</td>
					<td style="width:10%">Sexo</td>
					<td style="width:10%">Usuario</td>
					<td style="width:10%"></td>
					<td style="width:10%"></td>
					<td style="width:10%"></td>
				</tr>
				<tr>
					<td><input id="txtCodigo" type="text" style="width:80px" readonly="readonly"></td>					
					<td><input id="txtApellidos" type="text" style="width:250px" class="R"></td>
					<td><input id="txtNombres" type="text" style="width:250px" class="R"></td>
					<td><input id="txtDNI" type="text" style="width:150px" class="R"></td>
					<td><input id="txtFechaNac" type="date" style="width:150px" class="R"></td>
					<td>
						<select id="cboSexo" style="width:150px">
							<option value="M">Masculino</option>
							<option value="F">Femenino</option>
						</select>
					</td>
					<td><input id="txtUsuario" type="text" style="width:120px" class="R"></td>
					<td><input id="btnActivarCamara" type="button" value="Activar Camara" /></td>
					<td><input id="btnTomarFoto" type="button" value="Tomar Foto" /></td>
					<td><input id="btnGrabarEmpleado" type="button" value="Grabar Empleado" /></td>
				</tr>
			</table>
			<div>
				<div><video id="video" width="600" height="500" style="float:left"></video></div>
				<div><canvas id="canvas" width="600" height="500" style="float:left"></canvas></div>
				<div><canvas id="canvasCara" width="200" height="200" style="float:left;display:none"></canvas></div>
				<div><img id="imgCara" src="" width="200" height="200" style="float:left"/>
			</div>
			{% csrf_token %}
		</div>
		<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
		<script src="{% static 'appDemo07/RegistroEmpleado.js'%}"></script>
	</body>
</html>
